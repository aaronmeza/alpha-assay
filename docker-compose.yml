#
# observability + paper-trader stack for a single Linux Docker host.
#
# ADR decision 7 constraints:
#   - Non-default host ports (prometheus 19090, grafana 13000, paper-trader
#     metrics 18000, breadth-recorder metrics 18001).
#   - Loopback-only by default: every host port binds 127.0.0.1, so
#     services are not reachable from the public internet on a default
#     deploy. Operators are expected to provide their own access layer
#     (VPN, reverse-proxy, identity-aware proxy, etc.) on top.
#   - Dedicated bridge network `alphaassay_observability` and container
#     names prefixed `alphaassay-` so the stack co-exists with anything
#     else running on the host.
#
# Secrets (IBKR creds, Databento API key) are loaded from `.env.secrets` at the
# repo root via the `env_file:` directive. That file is in .gitignore; use
# `.env.secrets.example` as a template. Do NOT commit real credentials.
#
# Bringup:
#   docker compose up -d                        # paper-trader + prometheus + grafana
#   docker compose --profile recorder up -d     # includes breadth-recorder #
# See README.md for deployment notes.

services:
  paper-trader:
    # always-flat IBKR paper dry-run. Connects to a real IBKR
    # paper account, subscribes to ES bars + TICK-NYSE breadth,
    # increments observability counters, and NEVER submits orders.
    # The heartbeat-only stub (scripts/paper_trader_stub.py) is
    # kept in the repo as a fallback / reference; flip the `command:`
    # below to that file if you need to bring the stack up without
    # IBKR creds (e.g. local laptop smoke test).
    build:
      context: .
      dockerfile: infra/paper-trader/Dockerfile
    image: alphaassay/paper-trader:0.1.0
    container_name: alphaassay-paper-trader
    # unless-stopped (not on-failure:N) so the connection watchdog's EXIT_RESTART
    # reconnects indefinitely across the nightly IB Gateway / IBC restart - the
    # capped on-failure:3 would stop recycling after 3 exits and re-strand the
    # order path. Matches ibkr-feed. (alphaassay-0n6)
    #
    # Deliberately NOT uncapped `on-failure`: this is the always-on deployment
    # service (DRYRUN_DURATION_SECONDS=0, never self-exits EXIT_OK), so the only
    # clean exit is an operator `docker stop`, which unless-stopped honours (stays
    # down). unless-stopped also survives a host reboot, which on-failure does not.
    # The EXIT_OK/EXIT_RESTART distinction the code returns still matters for a
    # finite dry-run run OUTSIDE compose (e.g. `docker run --rm` with a duration);
    # under this always-on service both codes recycle, which is the intent here.
    restart: unless-stopped
    command: ["python", "-u", "/app/scripts/paper_dryrun.py"]
    environment:
      METRICS_PORT: "8000"
      ALPHA_ASSAY_ENV: paper-dryrun
      TZ: America/Chicago
      # IBKR connection params. the host runs IB Gateway (paper) headless on
      # 4002 so that is the documented default. Override IBKR_HOST in
      # .env.secrets if Gateway runs on a different host.
      IBKR_HOST: ${IBKR_HOST:-127.0.0.1}
      IBKR_PORT: ${IBKR_PORT:-4002}
      IBKR_CLIENT_ID: ${IBKR_CLIENT_ID:-1}
      IBKR_ACCOUNT: ${IBKR_ACCOUNT:-}
      # ES_EXPIRY left intentionally unset - the daemon resolves the front-month
      # via IBKR ContFuture at startup. Set ES_EXPIRY here ONLY as an emergency
      # override (force-pin to a specific YYYYMMDD contract).
      ES_EXPIRY: ${ES_EXPIRY:-}
    env_file:
      - path: .env.secrets
        required: false
    depends_on:
      redis:
        condition: service_healthy
      ibkr-feed:
        condition: service_healthy
    ports:
      # host -> container. 127.0.0.1 only - operator's access layer
      # decides what reaches it.
      - "127.0.0.1:18000:8000"
    networks:
      - alphaassay_observability
    volumes:
      - paper_trader_logs:/app/logs
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8000/metrics"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 10s

  breadth-recorder:
    # IBKR breadth recorder. Consumes the read-only IBKRAdapter
    # stream for TICK-NYSE + AD-NYSE, aggregates causally to 1-min bars,
    # writes rolling daily parquet shards to /data/breadth. Profile-gated
    # so `docker compose up` without --profile recorder skips it; the
    # recorder only runs on the host during an active IBKR session.
    profiles:
      - recorder
    image: alphaassay/breadth-recorder:0.1.0
    build:
      context: .
      dockerfile: infra/recorders/ibkr_breadth/Dockerfile
    container_name: alphaassay-breadth-recorder
    restart: on-failure:3
    environment:
      METRICS_PORT: "8001"
      OUT_DIR: /data/breadth
      ALPHA_ASSAY_ENV: paper-dryrun
      TZ: America/Chicago
    env_file:
      - path: .env.secrets
        required: false
    command: ["python", "-u", "/app/infra/recorders/ibkr_breadth/run.py"]
    ports:
      - "127.0.0.1:18001:8001"
    networks:
      - alphaassay_observability
    volumes:
      - breadth_parquet:/data/breadth
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8001/metrics"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 10s

  es-bars-recorder:
    # IBKR ES 1-min bar recorder. Sibling to breadth-recorder.
    # Subscribes to a single ES futures contract via the read-only
    # IBKRAdapter and writes rolling daily parquet shards to /data/es_bars
    # in the canonical OHLCV schema accepted by
    # alpha_assay.data.databento_adapter.load_parquet. Profile-gated under
    # the same `recorder` profile as breadth-recorder so the laptop dev
    # loop still skips both by default.
    profiles:
      - recorder
    image: alphaassay/es-bars-recorder:0.1.0
    build:
      context: .
      dockerfile: infra/recorders/ibkr_es_bars/Dockerfile
    container_name: alphaassay-es-bars-recorder
    restart: on-failure:3
    environment:
      METRICS_PORT: "8002"
      OUT_DIR: /data/es_bars
      ALPHA_ASSAY_ENV: paper-dryrun
      TZ: America/Chicago
      # Distinct client id so paper-trader (1) + breadth-recorder (21)
      # + this recorder can share an IB Gateway.
      IBKR_HOST: ${IBKR_HOST:-127.0.0.1}
      IBKR_PORT: ${IBKR_PORT:-4002}
      IBKR_CLIENT_ID: ${ES_BARS_IBKR_CLIENT_ID:-22}
      IBKR_ACCOUNT: ${IBKR_ACCOUNT:-}
      # ES_EXPIRY left intentionally unset - the daemon resolves the front-month
      # via IBKR ContFuture at startup. Set ES_EXPIRY here ONLY as an emergency
      # override (force-pin to a specific YYYYMMDD contract).
      ES_EXPIRY: ${ES_EXPIRY:-}
    env_file:
      - path: .env.secrets
        required: false
    depends_on:
      redis:
        condition: service_healthy
      ibkr-feed:
        condition: service_healthy
    command: ["python", "-u", "/app/infra/recorders/ibkr_es_bars/run.py"]
    ports:
      - "127.0.0.1:18002:8002"
    networks:
      - alphaassay_observability
    volumes:
      - es_bars_parquet:/data/es_bars
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8002/metrics"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 10s

  nq-bars-recorder:
    # NQ front-month 1-min bar recorder: a second instance of the
    # es-bars-recorder image with BARS_SYMBOL=NQ. Shard layout, metric
    # names, and bus-consumer behaviour are identical to ES (series are
    # distinguished by the `feed` label and the scrape job). Gated under
    # its own `recorder-nq` profile so existing `--profile recorder`
    # deployments do not pick it up until the operator opts in - the
    # ibkr-feed manifest must also include the NQ bars subscription
    # (see configs/feed-manifest-extended.yaml) for this consumer to
    # have a stream to read.
    profiles:
      - recorder-nq
    image: alphaassay/es-bars-recorder:0.1.0
    build:
      context: .
      dockerfile: infra/recorders/ibkr_es_bars/Dockerfile
    container_name: alphaassay-nq-bars-recorder
    restart: on-failure:3
    environment:
      METRICS_PORT: "8004"
      OUT_DIR: /data/nq_bars
      ALPHA_ASSAY_ENV: paper-dryrun
      TZ: America/Chicago
      BARS_SYMBOL: NQ
      BARS_EXCHANGE: CME
      BARS_CURRENCY: USD
      # Distinct client id (only used in legacy direct-IBKR mode; the
      # bus-consumer path never opens its own IBKR connection).
      IBKR_HOST: ${IBKR_HOST:-127.0.0.1}
      IBKR_PORT: ${IBKR_PORT:-4002}
      IBKR_CLIENT_ID: ${NQ_BARS_IBKR_CLIENT_ID:-24}
      IBKR_ACCOUNT: ${IBKR_ACCOUNT:-}
      # BARS_EXPIRY left intentionally unset - ibkr-feed resolves the NQ
      # front-month via ContFuture and publishes it to Redis. Set
      # BARS_EXPIRY here ONLY as an emergency override. (The stack-wide
      # ES_EXPIRY emergency pin is deliberately ignored by this instance.)
      BARS_EXPIRY: ${NQ_EXPIRY:-}
    env_file:
      - path: .env.secrets
        required: false
    depends_on:
      redis:
        condition: service_healthy
      ibkr-feed:
        condition: service_healthy
    command: ["python", "-u", "/app/infra/recorders/ibkr_es_bars/run.py"]
    ports:
      - "127.0.0.1:18004:8004"
    networks:
      - alphaassay_observability
    volumes:
      - nq_bars_parquet:/data/nq_bars
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8004/metrics"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 10s

  dashboard:
    # Streamlit results browser. Profile-gated so `docker compose up`
    # without --profile dashboard skips it. Bind-mounts RUNS_DIR from
    # the host so the container can read run outputs without copying data.
    #
    # Bringup:
    #   RUNS_DIR=/path/to/runs docker compose --profile dashboard up -d dashboard
    profiles:
      - dashboard
    build:
      context: .
      dockerfile: infra/dashboard/Dockerfile
    image: alphaassay/dashboard:0.1.0
    container_name: alphaassay-dashboard
    restart: unless-stopped
    environment:
      RUNS_DIR: /runs
      TZ: America/Chicago
    ports:
      - "127.0.0.1:13001:8501"
    volumes:
      - type: bind
        source: ${RUNS_DIR:-./runs}
        target: /runs
        read_only: true
    networks:
      - alphaassay_observability
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8501/_stcore/health"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 15s

  redis:
    # Single-host bus for the alpha-assay market-data pipeline.
    # AOF appendfsync always: zero-loss on host crash; ~0.5ms publish-side
    # latency cost which is invisible relative to IBKR order RTT.
    image: redis:7-alpine
    container_name: alphaassay-redis
    command: >
      redis-server
      --appendonly yes
      --appendfsync always
      --auto-aof-rewrite-percentage 100
      --auto-aof-rewrite-min-size 64mb
      --maxmemory-policy noeviction
    restart: unless-stopped
    networks:
      - alphaassay_observability
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 5s

  ibkr-feed:
    # Single producer holding the IBKR subscription per contract.
    # Publishes to Redis Streams via alpha_assay.bus.Producer with WAL.
    profiles:
      - feed
    build:
      context: .
      dockerfile: infra/feed/Dockerfile
    image: alphaassay/ibkr-feed:0.1.0
    container_name: alphaassay-ibkr-feed
    restart: unless-stopped
    environment:
      REDIS_URL: redis://redis:6379/0
      MANIFEST_PATH: /app/configs/feed-manifest.yaml
      METRICS_PORT: "8003"
      IBKR_HOST: 127.0.0.1
      IBKR_PORT: "4002"
      IBKR_CLIENT_ID: "30"
      WAL_DIR: /var/lib/alphaassay/wal
      TZ: America/Chicago
    depends_on:
      redis:
        condition: service_healthy
    networks:
      - alphaassay_observability
    volumes:
      - feed_wal:/var/lib/alphaassay/wal
    healthcheck:
      # Healthy only when /metrics reports an active IBKR connection. A
      # wedged feed (socket dropped, the watchdog about to exit, or the
      # container mid-restart) serves `alpha_assay_ibkr_connected 0.0` or
      # nothing at all - the old "HTTP 200 on /metrics" check passed
      # straight through that. Brief unhealthy windows during the nightly
      # IBC cycle are expected and self-heal once the feed reconnects;
      # start_period gives the post-restart connect room before failures
      # count, and `restart: unless-stopped` is what actually recycles.
      test: ["CMD", "python", "-c", "import urllib.request,sys; m=urllib.request.urlopen('http://localhost:8003/metrics',timeout=3).read().decode(); sys.exit(0 if 'alpha_assay_ibkr_connected 1.0' in m else 1)"]
      interval: 30s
      timeout: 5s
      retries: 4
      start_period: 45s

  bot:
    profiles:
      - bot
    build:
      context: .
      dockerfile: infra/bot/Dockerfile
    image: alphaassay/bot:0.1.0
    container_name: alphaassay-bot
    restart: unless-stopped
    environment:
      REDIS_URL: redis://redis:6379/0
      PROM_URL: http://prometheus:9090
      OFFSET_PATH: /var/lib/alphaassay/bot/offset
      TZ: America/Chicago
    env_file:
      - path: .env.bot
        required: false
    depends_on:
      redis:
        condition: service_healthy
    networks:
      - alphaassay_observability
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - bot_state:/var/lib/alphaassay/bot
    healthcheck:
      # PID 1 is python running infra.bot.main; if the loop crashes we
      # want the container to exit, not stay healthy with a dead poller.
      test: ["CMD", "python", "-c", "import sys; sys.exit(0 if 'main' in open('/proc/1/cmdline').read() else 1)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s

  prometheus:
    image: prom/prometheus:v2.55.0
    container_name: alphaassay-prometheus
    restart: unless-stopped
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
      - "--storage.tsdb.retention.time=30d"
      - "--web.enable-lifecycle"
    volumes:
      - ./observability/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    ports:
      - "127.0.0.1:19090:9090"
    networks:
      - alphaassay_observability
    # Reach scrape targets that run with network_mode: host (recorders,
    # paper-trader). Linux Docker doesn't auto-provide host.docker.internal;
    # the explicit host-gateway mapping makes it resolve to the bridge
    # network gateway IP. Mac Docker Desktop already provides this name
    # natively but the entry is harmless there.
    extra_hosts:
      - "host.docker.internal:host-gateway"
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "-", "http://127.0.0.1:9090/-/ready"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 10s

  grafana:
    image: grafana/grafana:11.3.0
    container_name: alphaassay-grafana
    restart: unless-stopped
    environment:
      GF_SECURITY_ADMIN_USER: admin
      # Override at deploy-time via .env.secrets (GF_SECURITY_ADMIN_PASSWORD).
      GF_SECURITY_ADMIN_PASSWORD: ${GF_SECURITY_ADMIN_PASSWORD:-alphaassay}
      GF_USERS_ALLOW_SIGN_UP: "false"
      # Trust the upstream auth gate (e.g. Cloudflare Access tunnel).
      # Disable the local login form and grant anonymous Admin access.
      # Safe only when traffic to :3000 is gated by an upstream identity
      # provider; do NOT expose this port to the open internet.
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: "Admin"
      GF_AUTH_DISABLE_LOGIN_FORM: "true"
      # Land users on the provisioned alphaassay dashboard instead of
      # the default Grafana home page.
      GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH: /var/lib/grafana/dashboards/alphaassay.json
      TZ: America/Chicago
    env_file:
      - path: .env.secrets
        required: false
    volumes:
      - grafana_data:/var/lib/grafana
      - ./observability/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./observability/grafana/dashboards:/var/lib/grafana/dashboards:ro
    ports:
      - "127.0.0.1:13000:3000"
    networks:
      - alphaassay_observability
    depends_on:
      - prometheus
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O - http://127.0.0.1:3000/api/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s

  alerts:
    # Lightweight alert poller. Watches Prometheus for IBKR feed-freshness
    # breaches during RTH and posts to a Telegram chat on state transition.
    # Stdlib-only Python; no extra runtime deps.
    profiles:
      - alerts
    build:
      context: .
      dockerfile: infra/alerts/Dockerfile
    image: alphaassay/alerts:0.1.0
    container_name: alphaassay-alerts
    restart: unless-stopped
    environment:
      PROMETHEUS_URL: http://prometheus:9090
      POLL_INTERVAL_SECONDS: "60"
      FRESHNESS_THRESHOLD: "60"
      SUSTAIN_SECONDS: "300"
      # Jobs this deployment DECLARES must be up - the process-liveness rule pages
      # if any reports up==0 during RTH (catches a crashed/gone container, incl.
      # one that died overnight). Both run in the default profile set alongside the
      # alerter; a partial deployment should narrow this list. (alphaassay-0n6)
      LIVENESS_JOBS: ibkr-feed,paper-trader
      RTH_TZ: America/Chicago
      RTH_START_HHMM: "0830"
      RTH_END_HHMM: "1500"
      TZ: America/Chicago
    # TELEGRAM_BOT_TOKEN + TELEGRAM_CHAT_ID load from .env.alerts. They
    # are intentionally NOT in environment: above; ${VAR:-} defaults to
    # empty and silently overrides env_file in docker-compose's merge
    # order.
    env_file:
      - path: .env.alerts
        required: false
    depends_on:
      - prometheus
    networks:
      - alphaassay_observability
    healthcheck:
      # No HTTP surface; PID 1 is the python interpreter running main.py
      # (CMD form, no shell wrapping). If the loop crashes we want the
      # container to exit, not stay healthy with a dead poller, so check
      # the cmdline contains "main.py".
      test: ["CMD", "python", "-c", "import sys; sys.exit(0 if 'main.py' in open('/proc/1/cmdline').read() else 1)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s

networks:
  alphaassay_observability:
    name: alphaassay_observability
    driver: bridge

volumes:
  prometheus_data:
    name: alphaassay_prometheus_data
  grafana_data:
    name: alphaassay_grafana_data
  paper_trader_logs:
    name: alphaassay_paper_trader_logs
  breadth_parquet:
    name: alphaassay_breadth_parquet
  es_bars_parquet:
    name: alphaassay_es_bars_parquet
  nq_bars_parquet:
    name: alphaassay_nq_bars_parquet
  redis_data:
    name: alphaassay_redis_data
  feed_wal:
    name: alphaassay_feed_wal
  bot_state:
    name: alphaassay_bot_state
