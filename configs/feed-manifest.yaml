# Default subscriptions for ibkr-feed. Edit + restart feed to change.
# Every entry produces one Redis Stream.
#
# This is the conservative core set. For the extended set (NQ bars,
# TICK-NASD / AD-NASD, VIX) point MANIFEST_PATH at
# configs/feed-manifest-extended.yaml - field docs live there.
subscriptions:
  - kind: bars
    contract:
      symbol: ES
      sec_type: FUT
      exchange: CME
      currency: USD
      expiry: "20260618"
    bar_size: "1 min"
    what_to_show: TRADES
  - kind: ticks
    symbol: TICK-NYSE
  - kind: ticks
    symbol: AD-NYSE
